<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360° 實境賞車全景展示</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght=700;900&family=Noto+Sans+TC:wght=400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', 'Urbanist', sans-serif; background-color: #030712; color: #f9fafb; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); }
        .toast-transition { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body class="w-screen h-screen relative select-none overflow-hidden bg-slate-950">
    <!-- 360 Viewport Container -->
    <div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

    <!-- Top Header Control Bar -->
    <div id="header-bar" class="absolute top-4 inset-x-4 max-w-5xl mx-auto z-20 flex flex-wrap items-center justify-between gap-3 p-3.5 rounded-2xl glass-panel shadow-2xl transition-all duration-300 transform translate-y-0 opacity-100">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-amber-300 flex items-center justify-center text-lg shadow-lg shrink-0">
                <i class="fa-solid fa-vr-cardboard"></i>
            </div>
            <div>
                <h1 id="viewer-title" class="text-sm md:text-base font-black truncate max-w-[180px] sm:max-w-xs text-white">360° 實境賞車</h1>
                <p class="text-[10px] text-slate-400 font-bold">720° 全方位探索 ｜ 高畫質原圖載入</p>
            </div>
        </div>

        <div class="flex items-center flex-wrap gap-2">
            <!-- 體感陀螺儀按鈕 -->
            <button id="btn-gyro" onclick="toggleGyro()" class="bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 transition-all">
                <i class="fa-solid fa-compass text-teal-400"></i> <span class="hidden sm:inline">陀螺儀</span>
            </button>

            <!-- 自動旋轉按鈕 -->
            <button id="btn-autorotate" onclick="toggleAutoRotate()" class="bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 transition-all">
                <i class="fa-solid fa-arrows-spin text-amber-400"></i> <span class="hidden sm:inline">自動旋轉</span>
            </button>

            <!-- 下載原圖按鈕 -->
            <button onclick="downloadOriginalPhoto()" class="bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 transition-all">
                <i class="fa-solid fa-download text-emerald-400"></i> <span class="hidden sm:inline">下載原圖</span>
            </button>

            <!-- 重置角度按鈕 -->
            <button onclick="resetView()" class="bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 transition-all">
                <i class="fa-solid fa-rotate-left"></i> <span class="hidden sm:inline">重置角度</span>
            </button>

            <!-- 全螢幕按鈕 -->
            <button onclick="toggleFullscreen()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-xl font-black flex items-center gap-1.5 transition-all shadow-md">
                <i class="fa-solid fa-expand"></i> <span class="hidden sm:inline">全螢幕</span>
            </button>

            <!-- 隱藏介面按鈕 (針對手機端避免遮擋) -->
            <button onclick="hideUI()" title="隱藏控制列" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-xs p-2 rounded-xl font-bold flex items-center justify-center transition-all ml-1">
                <i class="fa-solid fa-eye-slash text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Floating Unhide UI Button (Appears when header is hidden) -->
    <button id="btn-show-ui" onclick="showUI()" class="hidden absolute top-4 right-4 z-20 bg-slate-900/80 hover:bg-slate-900 text-amber-400 border border-amber-400/30 w-11 h-11 rounded-full flex items-center justify-center shadow-xl backdrop-blur-md active:scale-95 transition-all">
        <i class="fa-solid fa-eye text-lg"></i>
    </button>

    <!-- Custom Toast Message Notification -->
    <div id="toast-msg" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 border border-slate-700 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl backdrop-blur-md pointer-events-none opacity-0 transform translate-y-4 toast-transition flex items-center gap-2">
        <i id="toast-icon" class="fa-solid fa-circle-info text-emerald-400"></i>
        <span id="toast-text">提示訊息</span>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-box" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center text-white gap-4 z-30 transition-opacity duration-500">
        <i class="fa-solid fa-circle-notch fa-spin text-5xl text-indigo-500"></i>
        <p id="loading-text" class="text-sm font-black text-slate-200">正在加載 360° 高畫質全景照片...</p>
    </div>

    <!-- Error Fallback Modal -->
    <div id="error-box" class="hidden absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center text-white p-6 text-center gap-3 z-40">
        <div class="w-16 h-16 bg-rose-500/20 text-rose-500 rounded-full flex items-center justify-center text-3xl mb-1">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h3 class="text-lg font-black">無法載入此 360 照片</h3>
        <p class="text-xs text-slate-300 max-w-md leading-relaxed">請檢查 Google Drive 權限是否已開啟「知道連結的任何人皆可檢視」。</p>
        <button onclick="loadDemoImage()" class="mt-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black px-5 py-3 rounded-xl transition-all shadow-lg">
            載入示範圖檔測試
        </button>
    </div>

    <script>
        const demoPanoramaUrl = "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/2294472375_24a3b8ef46_o.jpg";

        let currentActiveImageUrl = demoPanoramaUrl;
        let scene, camera, renderer, mesh;
        let isUserInteracting = false;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
        let lon = 0, onPointerDownLon = 0;
        let lat = 0, onPointerDownLat = 0;
        let phi = 0, theta = 0;
        let fov = 75;
        let autoRotate = false;

        // Gyroscope tracking variables
        let gyroEnabled = false;
        let gyroInitialAlpha = null;
        let gyroInitialBeta = null;
        let gyroBaseLon = 0;
        let gyroBaseLat = 0;

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const rawUrl = urlParams.get('url');
            const title = urlParams.get('title') || '360° 實境賞車';

            document.getElementById('viewer-title').innerText = title;

            if (rawUrl) {
                currentActiveImageUrl = parseDirectImageUrl(rawUrl);
            } else {
                currentActiveImageUrl = demoPanoramaUrl;
            }

            init360Viewer(currentActiveImageUrl);
        };

        function parseDirectImageUrl(src) {
            if (!src) return demoPanoramaUrl;
            let clean = String(src).trim().replace(/^["']|["']$/g, '');
            const driveMatch = clean.match(/(?:file\/d\/|id=|lh3\.googleusercontent\.com\/d\/|uc\?id=)([a-zA-Z0-9_-]{25,})/i) 
                            || clean.match(/\/d\/([a-zA-Z0-9_-]{25,})/i);
            if (driveMatch && driveMatch[1]) {
                // 強制加上 =s0 取得 Google 原圖最高解析度 (非壓縮圖片)
                return `https://lh3.googleusercontent.com/d/${driveMatch[1]}=s0`;
            }
            return clean;
        }

        function init360Viewer(imageUrl) {
            const container = document.getElementById('canvas-container');
            const loadingBox = document.getElementById('loading-box');
            const errorBox = document.getElementById('error-box');

            const width = window.innerWidth;
            const height = window.innerHeight;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(fov, width / height, 1, 1100);
            camera.target = new THREE.Vector3(0, 0, 0);

            // 球體幾何體 (反轉 X 軸以將質體貼在內部)
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);

            const loader = new THREE.TextureLoader();
            loader.setCrossOrigin('anonymous');

            loader.load(
                imageUrl,
                function (texture) {
                    texture.minFilter = THREE.LinearFilter;
                    const material = new THREE.MeshBasicMaterial({ map: texture });
                    mesh = new THREE.Mesh(geometry, material);
                    scene.add(mesh);

                    loadingBox.classList.add('opacity-0', 'pointer-events-none');
                    animate();
                    showToast('360° 高畫質全景渲染完成，自由拖拽賞車', 'fa-circle-check');
                },
                undefined,
                function (err) {
                    console.error("360 載入失敗：", err);
                    loadingBox.classList.add('opacity-0', 'pointer-events-none');
                    errorBox.classList.remove('hidden');
                }
            );

            setupInteractionListeners(container);
            window.addEventListener('resize', onWindowResize);
        }

        function setupInteractionListeners(container) {
            const dom = renderer.domElement;

            const onPointerDown = (e) => {
                isUserInteracting = true;
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                onPointerDownPointerX = clientX;
                onPointerDownPointerY = clientY;
                onPointerDownLon = lon;
                onPointerDownLat = lat;

                // 重置陀螺儀基準點
                gyroInitialAlpha = null;
                gyroInitialBeta = null;
            };

            const onPointerMove = (e) => {
                if (!isUserInteracting) return;
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                lon = (onPointerDownPointerX - clientX) * 0.15 + onPointerDownLon;
                lat = (clientY - onPointerDownPointerY) * 0.15 + onPointerDownLat;
            };

            const onPointerUp = () => { isUserInteracting = false; };

            const onWheel = (e) => {
                fov += e.deltaY * 0.05;
                fov = Math.max(30, Math.min(100, fov));
                camera.fov = fov;
                camera.updateProjectionMatrix();
            };

            dom.addEventListener('mousedown', onPointerDown);
            dom.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            dom.addEventListener('touchstart', onPointerDown, { passive: true });
            dom.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('touchend', onPointerUp);

            dom.addEventListener('wheel', onWheel, { passive: true });
        }

        function toggleGyro() {
            if (gyroEnabled) {
                disableGyro();
            } else {
                enableGyro();
            }
        }

        function enableGyro() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS Safari 權限申請
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startGyroListener();
                        } else {
                            showToast('陀螺儀存取權限已被拒絕', 'fa-triangle-exclamation');
                        }
                    })
                    .catch(err => {
                        console.error('Gyro request error:', err);
                        showToast('裝置不支援陀螺儀感應', 'fa-circle-xmark');
                    });
            } else if (window.DeviceOrientationEvent) {
                startGyroListener();
            } else {
                showToast('您的裝置不支援陀螺儀感應', 'fa-circle-xmark');
            }
        }

        function startGyroListener() {
            window.addEventListener('deviceorientation', handleOrientation, true);
            gyroEnabled = true;
            gyroInitialAlpha = null;
            gyroInitialBeta = null;

            const btn = document.getElementById('btn-gyro');
            btn.classList.add('bg-teal-600', 'text-white');
            showToast('已啟用體感陀螺儀賞車', 'fa-compass');
        }

        function disableGyro() {
            window.removeEventListener('deviceorientation', handleOrientation, true);
            gyroEnabled = false;
            gyroInitialAlpha = null;
            gyroInitialBeta = null;

            const btn = document.getElementById('btn-gyro');
            btn.classList.remove('bg-teal-600', 'text-white');
            showToast('已關閉體感陀螺儀', 'fa-compass');
        }

        function handleOrientation(event) {
            if (!gyroEnabled || isUserInteracting) return;

            let alpha = event.alpha || 0; // z-axis rotation [0, 360]
            let beta = event.beta || 0;   // x-axis rotation [-180, 180]

            if (gyroInitialAlpha === null) {
                gyroInitialAlpha = alpha;
                gyroInitialBeta = beta;
                gyroBaseLon = lon;
                gyroBaseLat = lat;
            }

            let deltaAlpha = alpha - gyroInitialAlpha;
            let deltaBeta = beta - gyroInitialBeta;

            // 處理 0 - 360 跨越限界情況
            if (deltaAlpha > 180) deltaAlpha -= 360;
            if (deltaAlpha < -180) deltaAlpha += 360;

            lon = gyroBaseLon - deltaAlpha * 0.9;
            lat = gyroBaseLat + deltaBeta * 0.9;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate && !isUserInteracting && !gyroEnabled) {
                lon += 0.15;
            }

            // 解鎖俯仰角度限制 (-85° 至 +85°)
            lat = Math.max(-85, Math.min(85, lat));
            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
            camera.target.y = 500 * Math.cos(phi);
            camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);

            camera.lookAt(camera.target);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function resetView() {
            lon = 0; lat = 0; fov = 75;
            camera.fov = fov;
            camera.updateProjectionMatrix();
            gyroInitialAlpha = null;
            gyroInitialBeta = null;
            showToast('已重置最佳賞車角度', 'fa-rotate-left');
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            const btn = document.getElementById('btn-autorotate');
            if (autoRotate) {
                btn.classList.add('bg-indigo-600', 'text-amber-300');
                showToast('已開啟自動旋轉賞車', 'fa-arrows-spin');
            } else {
                btn.classList.remove('bg-indigo-600', 'text-amber-300');
                showToast('已停止自動旋轉', 'fa-pause');
            }
        }

        function hideUI() {
            const headerBar = document.getElementById('header-bar');
            const btnShowUI = document.getElementById('btn-show-ui');

            headerBar.classList.add('-translate-y-28', 'opacity-0', 'pointer-events-none');
            headerBar.classList.remove('translate-y-0', 'opacity-100');

            setTimeout(() => {
                btnShowUI.classList.remove('hidden');
            }, 200);

            showToast('已隱藏控制列，點擊右上方按鈕復原', 'fa-eye-slash');
        }

        function showUI() {
            const headerBar = document.getElementById('header-bar');
            const btnShowUI = document.getElementById('btn-show-ui');

            btnShowUI.classList.add('hidden');
            headerBar.classList.remove('-translate-y-28', 'opacity-0', 'pointer-events-none');
            headerBar.classList.add('translate-y-0', 'opacity-100');
        }

        function downloadOriginalPhoto() {
            if (!currentActiveImageUrl) return;

            showToast('正在下載 360° 高畫質原圖...', 'fa-circle-arrow-down');
            const a = document.createElement('a');
            a.href = currentActiveImageUrl;
            a.target = '_blank';
            a.download = `360_Panorama_${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showToast('您的裝置不支援全螢幕模式', 'fa-circle-xmark');
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function showToast(msg, iconClass = 'fa-circle-info') {
            const toast = document.getElementById('toast-msg');
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');

            toastText.innerText = msg;
            toastIcon.className = `fa-solid ${iconClass} text-emerald-400`;

            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            if (window.toastTimer) clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2500);
        }

        function loadDemoImage() {
            location.href = `?url=${encodeURIComponent(demoPanoramaUrl)}&title=示範全景測試圖`;
        }
    </script>
</body>
</html>
